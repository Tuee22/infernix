{{/*
Phase 7 Sprint 7.7: stateful engine Deployment.

Hosts the adapter-side inference engine and the per-pod KV cache. The
ephemeral `model-cache` volume holds model weights pulled from
`infernix-models` MinIO on first use; the adapter-side LRU eviction keeps
the on-disk footprint under `engine.modelCache.sizeLimit` so kubelet does
not restart the pod for ephemeral-storage exhaustion.

Phase 3 Sprint 3.16: one engine process per machine, expressed as
`engine.replicaCount: 1` rather than as a scheduling constraint. The
retired required pod anti-affinity encoded the same rule as a *placement
preference the scheduler could leave unsatisfied* — it kept a second
replica `Pending` instead of preventing it. The rule itself is unchanged
and is stated where it belongs, in
`documents/architecture/daemon_topology.md`: two engine processes on one
box hold two KV caches and two copies of every loaded weight, and each
admits work independently against the machine's whole observed capacity.
Scale the fleet by adding machines. On a multi-GPU node the single
scheduled engine claims its device via `nvidia.com/gpu`; per-device model
assignment is owned by the active substrate `.dhall`.
*/}}
{{- if and .Values.daemonSplit.enabled .Values.engine.enabled (not .Values.engine.fleet.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernix-engine
  namespace: platform
  labels:
    app.kubernetes.io/name: infernix-engine
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: infernix-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernix-engine
        app.kubernetes.io/component: engine
    spec:
{{- if eq .Values.runtimeMode "linux-gpu" }}
      runtimeClassName: nvidia
      nodeSelector:
        infernix.runtime/gpu: "true"
{{- end }}
      containers:
        - name: infernix-engine
          image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag }}"
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          command:
{{ toYaml .Values.engine.command | nindent 12 }}
          # Phase 4 Sprint 4.13: daemon role is now a typed CLI arg
          # (`--role engine`) instead of an `INFERNIX_DAEMON_ROLE` env
          # var. The full `INFERNIX_PULSAR_*` env family is retired;
          # the daemon decodes those values from the mounted
          # `infernix-cluster-config` ConfigMap at startup.
          # Phase 6 Sprint 6.28 follow-on (May 26, 2026): the
          # `INFERNIX_DATA_ROOT` env entry was retired together with
          # the chart path realignment from `/srv/infernix/.data` to
          # `/workspace/.data` (matching the baked
          # `InfernixHost.dhall.filesystem.dataRoot` default). The
          # `INFERNIX_MODEL_CACHE_ROOT` env entry was also retired —
          # `Paths.modelCacheRoot` derives from the host manifest's
          # `runtimeRoot </> "model-cache"` and the engine's
          # adapter-driven cache materialization writes there
          # directly (the previously-mounted `/model-cache` emptyDir
          # was unused — the daemon never consumed the env override).
          args:
            - service
            - --role
            - engine
          # Phase 7 Sprint 7.17: credentials live in
          # `Secret/infernix-cluster-secrets` mounted at
          # `/etc/infernix/secrets/`; no `env:` block remains on the
          # engine template.
          resources:
            limits:
{{- with .Values.engine.resources.limits }}
{{ toYaml . | nindent 14 }}
{{- end }}
{{- if eq .Values.runtimeMode "linux-gpu" }}
              nvidia.com/gpu: "1"
{{- end }}
            requests:
{{- with .Values.engine.resources.requests }}
{{ toYaml . | nindent 14 }}
{{- end }}
{{- if eq .Values.runtimeMode "linux-gpu" }}
              nvidia.com/gpu: "1"
{{- end }}
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/infernix/cluster.dhall
              subPath: cluster.dhall
              readOnly: true
            - name: cluster-secrets
              mountPath: /etc/infernix/secrets
              readOnly: true
            - name: demo-config
              mountPath: "{{ .Values.demoConfig.mountPath }}/{{ .Values.demoConfig.fileName }}"
              subPath: {{ .Values.demoConfig.fileName }}
              readOnly: true
            - name: publication-state
              mountPath: "{{ .Values.demoConfig.mountPath }}/{{ .Values.publication.fileName }}"
              subPath: {{ .Values.publication.fileName }}
              readOnly: true
            - name: engine-data
              mountPath: /workspace/.data
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - test -f /workspace/.data/runtime/service/subscription.ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
      volumes:
        - name: cluster-config
          configMap:
            name: {{ .Values.clusterConfig.name }}
        - name: cluster-secrets
          secret:
            secretName: infernix-cluster-secrets
        - name: demo-config
          configMap:
            name: {{ .Values.demoConfig.name }}
        - name: publication-state
          configMap:
            name: {{ .Values.publication.name }}
        - name: engine-data
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: {{ .Values.engine.modelCache.sizeLimit }}
{{- end }}
{{- $root := . }}
{{- if and .Values.daemonSplit.enabled .Values.engine.enabled .Values.engine.perEngine.enabled }}
{{- range $engineName := .Values.engine.perEngine.names }}
{{- $image := index $root.Values.engine.perEngine.images $engineName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernix-engine-{{ $engineName }}
  namespace: platform
  labels:
    app.kubernetes.io/name: infernix-engine-{{ $engineName }}
    app.kubernetes.io/component: engine
    infernix.io/engine: {{ $engineName | quote }}
spec:
  replicas: {{ $root.Values.engine.perEngine.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: infernix-engine-{{ $engineName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernix-engine-{{ $engineName }}
        app.kubernetes.io/component: engine
        infernix.io/engine: {{ $engineName | quote }}
    spec:
{{- if eq $root.Values.runtimeMode "linux-gpu" }}
      runtimeClassName: nvidia
      nodeSelector:
        infernix.runtime/gpu: "true"
{{- end }}
      containers:
        - name: infernix-engine
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          command:
{{ toYaml $root.Values.engine.command | nindent 12 }}
          args:
            - service
            - --role
            - engine
            - --engine-name
            - {{ $engineName | quote }}
          resources:
            limits:
{{- with $root.Values.engine.resources.limits }}
{{ toYaml . | nindent 14 }}
{{- end }}
{{- if eq $root.Values.runtimeMode "linux-gpu" }}
              nvidia.com/gpu: "1"
{{- end }}
            requests:
{{- with $root.Values.engine.resources.requests }}
{{ toYaml . | nindent 14 }}
{{- end }}
{{- if eq $root.Values.runtimeMode "linux-gpu" }}
              nvidia.com/gpu: "1"
{{- end }}
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/infernix/cluster.dhall
              subPath: cluster.dhall
              readOnly: true
            - name: cluster-secrets
              mountPath: /etc/infernix/secrets
              readOnly: true
            - name: demo-config
              mountPath: "{{ $root.Values.demoConfig.mountPath }}/{{ $root.Values.demoConfig.fileName }}"
              subPath: {{ $root.Values.demoConfig.fileName }}
              readOnly: true
            - name: publication-state
              mountPath: "{{ $root.Values.demoConfig.mountPath }}/{{ $root.Values.publication.fileName }}"
              subPath: {{ $root.Values.publication.fileName }}
              readOnly: true
            - name: engine-data
              mountPath: /workspace/.data
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - test -f /workspace/.data/runtime/service/subscription.ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
      volumes:
        - name: cluster-config
          configMap:
            name: {{ $root.Values.clusterConfig.name }}
        - name: cluster-secrets
          secret:
            secretName: infernix-cluster-secrets
        - name: demo-config
          configMap:
            name: {{ $root.Values.demoConfig.name }}
        - name: publication-state
          configMap:
            name: {{ $root.Values.publication.name }}
        - name: engine-data
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: {{ $root.Values.engine.modelCache.sizeLimit }}
{{- end }}
{{- end }}
{{/*
Phase 8 Sprint 8.12: the fleet lane's per-machine engine Deployments.

Two shapes were candidates for "one engine per machine, and the machine knows
which member it is". A `DaemonSet` makes one pod per node true by construction,
but it cannot carry a *declared* identity: every pod of a DaemonSet is
identical, so a pod could only learn which machine it is from the downward API —
an `env:` block, which the no-environment-variables doctrine forbids in
infernix-owned templates — or from a Kubernetes API read, which makes identity
discovered rather than declared and so contradicts the fail-closed member-
identity rule in `documents/architecture/daemon_topology.md`. Generated
per-machine Deployments carry `--engine-name` as a compiled constant, and each
mounts its own binary-rendered machine contract. That is the shape chosen here.

The `Pending` failure mode Sprint 3.16 rejected for the engine pod anti-affinity
is a different thing from the `nodeSelector` below, and the difference is why
this is acceptable. Anti-affinity expressed the one-engine-per-machine
*correctness rule* as a constraint the scheduler could leave unsatisfied. Here
the correctness rule is carried by the broker-side member claim instead, and the
selector only places a declared machine on the node that is that machine: a slot
whose node is gone leaves that machine's engine `Pending`, which is the honest
rendering of a machine being down.
*/}}
{{- $fleetRoot := . }}
{{- if and .Values.daemonSplit.enabled .Values.engine.enabled .Values.engine.fleet.enabled }}
{{- range $machine := .Values.engine.fleet.machines }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernix-engine-m{{ $machine.slot }}
  namespace: platform
  labels:
    app.kubernetes.io/name: infernix-engine-m{{ $machine.slot }}
    app.kubernetes.io/component: engine
    infernix.io/engine-member: {{ $machine.name | quote }}
spec:
  replicas: {{ $fleetRoot.Values.engine.fleet.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: infernix-engine-m{{ $machine.slot }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernix-engine-m{{ $machine.slot }}
        app.kubernetes.io/component: engine
        infernix.io/engine-member: {{ $machine.name | quote }}
    spec:
      nodeSelector:
        {{ $fleetRoot.Values.engine.fleet.slotLabel }}: {{ $machine.slot | quote }}
      containers:
        - name: infernix-engine
          image: "{{ $fleetRoot.Values.engine.image.repository }}:{{ $fleetRoot.Values.engine.image.tag }}"
          imagePullPolicy: {{ $fleetRoot.Values.engine.image.pullPolicy }}
          command:
{{ toYaml $fleetRoot.Values.engine.command | nindent 12 }}
          args:
            - service
            - --role
            - engine
            - --engine-name
            - {{ $machine.name | quote }}
          resources:
            limits:
{{- with $fleetRoot.Values.engine.resources.limits }}
{{ toYaml . | nindent 14 }}
{{- end }}
            requests:
{{- with $fleetRoot.Values.engine.resources.requests }}
{{ toYaml . | nindent 14 }}
{{- end }}
          volumeMounts:
            - name: cluster-config
              mountPath: /opt/infernix/cluster.dhall
              subPath: cluster.dhall
              readOnly: true
            - name: cluster-secrets
              mountPath: /etc/infernix/secrets
              readOnly: true
            - name: demo-config
              mountPath: "{{ $fleetRoot.Values.demoConfig.mountPath }}/{{ $fleetRoot.Values.demoConfig.fileName }}"
              subPath: {{ $fleetRoot.Values.demoConfig.fileName }}
              readOnly: true
            - name: publication-state
              mountPath: "{{ $fleetRoot.Values.demoConfig.mountPath }}/{{ $fleetRoot.Values.publication.fileName }}"
              subPath: {{ $fleetRoot.Values.publication.fileName }}
              readOnly: true
            # This machine's own contract, at the path manifest discovery
            # prefers over the byte-identical image-baked default.
            - name: machine-contract
              mountPath: /workspace/infernix-host.dhall
              subPath: m{{ $machine.slot }}.dhall
              readOnly: true
            # The published system contract at the canonical repo-root path as
            # well as at its mount path, so this pod holds a real generated
            # *pair*. Without it the machine contract — pinned to the contract
            # this deployment published — would be checked against the
            # image-baked contract every image carries, and a fleet pod would
            # refuse itself over a disagreement that is an artefact of the image
            # rather than a fact about the fleet.
            - name: demo-config
              mountPath: /workspace/infernix.dhall
              subPath: {{ $fleetRoot.Values.demoConfig.fileName }}
              readOnly: true
            - name: engine-data
              mountPath: /workspace/.data
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - test -f /workspace/.data/runtime/service/subscription.ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
      volumes:
        - name: cluster-config
          configMap:
            name: {{ $fleetRoot.Values.clusterConfig.name }}
        - name: cluster-secrets
          secret:
            secretName: infernix-cluster-secrets
        - name: demo-config
          configMap:
            name: {{ $fleetRoot.Values.demoConfig.name }}
        - name: publication-state
          configMap:
            name: {{ $fleetRoot.Values.publication.name }}
        - name: machine-contract
          configMap:
            name: {{ $fleetRoot.Values.machineContracts.name }}
        - name: engine-data
          emptyDir: {}
        - name: model-cache
          emptyDir:
            sizeLimit: {{ $fleetRoot.Values.engine.modelCache.sizeLimit }}
{{- end }}
{{- end }}
