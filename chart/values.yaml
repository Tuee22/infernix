runtimeMode: apple-silicon
controlPlaneContext: host-native

global:
  security:
    allowInsecureImages: true

upstreamCharts:
  postgresOperator:
    enabled: true
  # Phase 7 Sprint 7.1: Patroni Postgres backing Keycloak. Gated on the
  # demo surface — production deploys (`demo_ui = false`) skip Keycloak
  # plus its database entirely.
  keycloakpg:
    enabled: true
  # Phase 3 Sprint 3.11 (2026-05-29): the upstream bitnami minio
  # sub-chart was retired in favor of the hand-authored MinIO
  # StatefulSet under `chart/templates/minio/`. The `infernixMinio:`
  # block at the bottom of this file is the supported MinIO
  # configuration surface.
  pulsar:
    enabled: true
  envoyGateway:
    enabled: true

gateway:
  publishedPort: 9090
  publishedNodePort: 30090
  listenerPort: 80

repoGateway:
  enabled: true

demoConfig:
  name: infernix-demo-config
  mountPath: /opt/build
  fileName: infernix.dhall
  catalogPayload: |
    {}

demo:
  enabled: true
  # Phase 3 Sprint 3.16: one process per role per machine. A second replica of a
  # stateless role on a single-node cluster buys no availability and doubles the
  # resident footprint.
  replicaCount: 1
  port: 8080
  image:
    repository: infernix-linux-cpu
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

publication:
  name: infernix-publication-state
  fileName: publication.json
  payloadJson: |
    {}

routes: []

operatorConsole:
  jwtGating:
    enabled: true
    cookieName: infernix_operator_token

# Phase 7 Sprint 7.7: shared backend wiring consumed by the supported
# three-role daemon split (coordinator + engine + demo). The legacy
# `service.{enabled,image,replicaCount,command,args,dataPvc}` keys are
# retired together with `chart/templates/deployment-service.yaml` and
# `chart/templates/persistentvolumeclaim-service-data.yaml`; what
# remains is the shared MinIO + Pulsar config the Deployment templates
# read.
service:
  minio:
    endpoint: http://infernix-minio.platform.svc.cluster.local:9000
    accessKey: minioadmin
    secretKey: minioadmin123
  pulsar:
    adminUrl: http://infernix-infernix-pulsar-proxy.platform.svc.cluster.local/admin/v2
    httpBaseUrl: http://infernix-infernix-pulsar-proxy.platform.svc.cluster.local
    webSocketBaseUrl: ws://infernix-infernix-pulsar-proxy.platform.svc.cluster.local/ws/v2
    serviceUrl: pulsar://infernix-infernix-pulsar-proxy.platform.svc.cluster.local:6650
    tenant: infernix
    namespace: demo
# Phase 7 Sprint 7.7: the supported three-role daemon split is now the
# default cluster topology. `daemonSplit.enabled = true` activates the
# coordinator + engine + demo Deployment templates below. Current
# generated values keep the coordinator and engine roles enabled for
# production `demo_ui = false` deployments; only `demo.enabled` follows
# the demo UI flag.
daemonSplit:
  enabled: true

# Phase 4 Sprint 4.13 / Phase 8 Sprint 8.4: typed cluster-wiring values. The
# `ConfigMap/infernix-cluster-config` body is the binary-rendered
# `.Values.clusterConfig.body` `cluster.dhall` string
# (`Infernix.ClusterConfig.renderClusterConfig`), which Helm only `nindent`s —
# per the zero-tracked-`.dhall` doctrine there is no tracked
# `dhall/InfernixCluster.dhall` file; the schema is reflected from the
# `Infernix.ClusterConfig` decoder type. The structured `clusterConfig.name` and
# `clusterConfig.keycloak.*` values are the only ones consumed structurally by
# templates (e.g. the operator-routes SecurityPolicy issuer); see
# `documents/engineering/cluster_config_manifest.md` for the full
# per-field origin mapping.
#
# Credentials are NOT here. They live in `Secret/infernix-cluster-secrets`
# (Phase 7 Sprint 7.17 materializes that companion template).
clusterConfig:
  name: infernix-cluster-config
  mountPath: /opt/infernix/cluster.dhall
  pulsar:
    systemNamespace: system
  minio:
    region: us-east-1
    presignExpirySeconds: 900
    modelsBucket: infernix-models
    demoArtifactsBucket: infernix-demo-objects
  keycloak:
    baseUrl: http://127.0.0.1/auth
    realmName: infernix
    clientId: infernix-spa
    jwksUrl: http://infernix-keycloak.platform.svc.cluster.local:8080/auth/realms/infernix/protocol/openid-connect/certs
  demoBackend:
    bindHost: 0.0.0.0
    port: 8080
    bridgeMode: pulsar
  engine:
    modelCacheRoot: /model-cache
    # Sized to match the engine deployment's `modelCache.sizeLimit`
    # (64 GiB) so the adapter-side LRU eviction stays under kubelet's
    # ephemeral-storage threshold. 64 GiB headroom is required because the
    # diffusers engine caches large diffusers-format repos (Wan2.1-T2V-1.3B
    # ships the multi-GB umt5-xxl text encoder) alongside SDXL in one engine
    # cache; 32 GiB evicted the diffusers pod mid-bootstrap on linux-gpu.
    modelCacheQuotaBytes: 68719476736
  coordinator:
    catalogSource: mounted-configmap
    daemonLocation: cluster-pod

coordinator:
  enabled: true
  # Phase 3 Sprint 3.16: one coordinator per machine (see demo above).
  replicaCount: 1
  image:
    repository: infernix-linux-cpu
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  command:
    - infernix
  # The Deployment template passes the typed `--role coordinator` CLI flag.
  # The retired `INFERNIX_DAEMON_ROLE` env path must not reappear.
  args:
    - service

engine:
  enabled: true
  # Phase 3 Sprint 3.16: exactly one engine process per machine, and that is a
  # correctness rule rather than a scheduling preference. Two engine processes on
  # one box hold two KV caches and two copies of every loaded weight, and each
  # admits work independently against the machine's whole observed capacity.
  # Scale the fleet by adding machines, never by raising this number.
  replicaCount: 1
  # Phase 8 Sprint 8.13: which engine member identity the shared engine
  # Deployment is. Sprint 8.12 made member identity fail closed, so a machine
  # contract that declares more than one member — every `linux-gpu` contract,
  # which declares one member per framework engine image plus `native` — leaves
  # a shared Deployment carrying no `--engine-name` unable to say which member
  # it is, and it refuses to start. The lifecycle always renders this; the
  # static default is empty so an operator values file for a single-member
  # contract keeps resolving that member implicitly.
  memberName: ""
  image:
    repository: infernix-linux-cpu
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      # The execution budget remains 4 GiB. The larger pod envelope keeps the
      # Haskell daemon and watchdog polling headroom outside the child grant.
      memory: 5Gi
  perEngine:
    enabled: false
    replicaCount: 0
    names: []
    images: {}
  # Phase 8 Sprint 8.12: the fleet lane. Disabled here because the deployed
  # platform topology is a single engine machine (Phase 3 Sprint 3.16); the
  # generated overlay turns it on when the system contract declares more than
  # one engine machine. Each entry is one machine: `slot` selects the node it
  # runs on and the machine contract it mounts, and `name` is the engine member
  # identity that machine adopts.
  fleet:
    enabled: false
    # Phase-gated exactly as `engine.replicaCount` is: an engine consumes Pulsar
    # topics, so it is held at zero until the phase that brings Pulsar up. A
    # fleet Deployment that started earlier would sit un-ready inside its own
    # phase's rollout wait and time the release out.
    replicaCount: 0
    slotLabel: infernix.fleet/slot
    machines: []
  command:
    - infernix
  args:
    - service
  modelCache:
    # `emptyDir` sizeLimit on the engine pod's `/model-cache` volume. The
    # adapter-side LRU eviction keeps the actual on-disk size under this
    # ceiling so kubelet never restarts the pod for ephemeral-storage
    # exhaustion. 64Gi accommodates the diffusers engine caching large
    # diffusers-format repos (e.g. Wan2.1-T2V-1.3B with the umt5-xxl text
    # encoder) alongside SDXL; 32Gi caused mid-bootstrap eviction on linux-gpu.
    sizeLimit: 64Gi

# Phase 8 Sprint 8.12: per-machine host manifests, rendered by the `infernix`
# binary and embedded here as strings. Helm only `nindent`s them, exactly as it
# does for `clusterConfig.body`. Keyed `m<slot>.dhall` so a Deployment mounts
# its own machine's contract by the same slot that pins it to its node.
machineContracts:
  name: infernix-machine-contracts
  bodies: {}

demoSplit:
  enabled: true
  # Phase 3 Sprint 3.16: one process per role per machine.
  replicaCount: 1

# Phase 3 Sprint 3.11 (2026-05-29): the hand-authored MinIO
# StatefulSet under `chart/templates/minio/` replaces the retired
# `bitnami/minio` v17.0.21 sub-chart. Bitnami moved free multi-arch
# images to `bitnamilegacy/*` (frozen amd64-only) in late 2025, and the
# upstream `minio/minio` image is not a drop-in replacement under the
# bitnami chart wrapper (the chart invokes the image with no args while
# the upstream image expects `minio server <path>` as CMD). Hand-
# authored templates give the platform full control over the StatefulSet
# CMD, distributed-mode endpoints, root credentials, and provisioning
# Job — no Bitnami licensing exposure ever again.
infernixMinio:
  enabled: true
  # Phase 3 Sprint 3.16: one instance per platform service. This changes the
  # on-disk layout — a single-node MinIO uses the plain `/data` backend rather
  # than the erasure-coded distributed one — so it is a teardown-and-rebuild,
  # not an in-place reconcile. See documents/tools/minio.md.
  replicaCount: 1
  image:
    repository: docker.io/minio/minio
    tag: "RELEASE.2025-09-07T16-13-09Z"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 4Gi
  clientImage:
    repository: docker.io/minio/mc
    tag: "RELEASE.2025-08-13T08-35-41Z"
    pullPolicy: IfNotPresent
  initImage:
    repository: docker.io/busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  service:
    nodePort: 30011
  persistence:
    storageClass: infernix-manual
    # The linux-gpu full catalog retains large lazy-bootstrap model bundles
    # (Wan2.1 T2V plus SDXL and quantized LLM/audio rows) in `infernix-models`.
    # Keep each distributed MinIO drive above the complete retained model set so
    # later rows can publish without tripping MinIO's low-free-space guard.
    size: 64Gi
  buckets:
    - infernix-registry
    # Phase 7 Sprint 7.7: always-on platform model-weights bucket. The
    # coordinator role's bootstrap subscription PUTs `<modelId>/<filename>`
    # entries here on first use of a model and writes the `.ready` sentinel
    # last; engines read from this bucket via the per-adapter model cache.
    - infernix-models
    # Phase 4 Sprint 4.18: always-on immutable engine software payload
    # bucket. Stores content-addressed wheelhouses, native binaries, Core ML
    # compiled models, JVM tools, and reusable materialization payloads.
    - infernix-engine-artifacts
    # Phase 7 Sprint 7.7: demo-gated user-artifact bucket. Hosts per-user
    # prefixes `users/<userId>/contexts/<contextId>/{uploads,generated}/`
    # for the durable-context surface; presigned PUT/GET URLs minted at
    # `/api/objects` are scoped per user.
    - infernix-demo-objects

# Phase 3 Sprint 3.17: the in-cluster image repository is the single-binary
# CNCF distribution registry (`registry:2`). It carries no database,
# no job service, no scanner, and no portal: one Deployment, one Service, and one
# ConfigMap holding the whole `config.yml`. The ConfigMap replaces the image's
# stock config outright rather than layering onto it -- distribution refuses to
# start with two configured storage drivers, and the shipped default declares
# `filesystem`.
registry:
  enabled: true
  image: docker.io/library/registry:2
  imagePullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 5000
    # The published image-repository port every lane's `kind/cluster-*.yaml`
    # `extraPortMappings` forwards and the dynamic port-discovery path resolves.
    nodePort: 30002
  # Blob storage is the same MinIO the rest of the platform uses. The bucket is
  # created by the MinIO provisioning Job before the registry starts, because
  # distribution's S3 driver requires the bucket to pre-exist.
  #
  # `redirect: disable: true` is mandatory, not tuning: the host-scope Docker
  # client pushing through `localhost:30002` cannot resolve a 307 redirect to
  # the cluster-only MinIO Service name, so blob requests must be proxied
  # through the registry itself.
  storage:
    bucket: infernix-registry
    region: us-east-1
    regionendpoint: http://infernix-minio.platform.svc.cluster.local:9000
    accesskey: minioadmin
    secretkey: minioadmin123
    secure: false
    v4auth: true
    # Quoted so Helm renders the integer literally: an unquoted YAML number
    # reaches the template as a float and stringifies as `3.3554432e+07`,
    # which distribution rejects at startup.
    chunksize: "33554432"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi


postgresOperator:
  fullnameOverride: infernix-postgres-operator
  image: docker.io/percona/percona-postgresql-operator:2.9.0
  imagePullPolicy: IfNotPresent

# Phase 7 Sprint 7.1: Patroni Postgres backing Keycloak. A dedicated Patroni
# cluster managed by the Percona operator, and the platform's only database
# cluster, with the `keycloak` role + database created by the operator and the
# generated credentials exposed via `infernix-keycloak-db-user` for the
# Keycloak Deployment to consume.
keycloakpg:
  fullnameOverride: keycloak-postgresql
  image: docker.io/percona/percona-distribution-postgresql:18.3-1
  imagePullPolicy: IfNotPresent
  postgresVersion: 18
  users:
    - name: keycloak
      databases:
        - keycloak
      password:
        type: ASCII
      secretName: infernix-keycloak-db-user
  databaseInitSQL:
    key: init.sql
    name: keycloak-postgresql-init-sql
  instances:
    - name: instance1
      # Phase 3 Sprint 3.16: one instance per platform service. The Percona
      # operator remains the deployment mechanism and is no longer retained as a
      # high-availability mechanism; instance loss is restore-from-backup.
      replicas: 1
      resources:
        requests:
          cpu: 75m
          memory: 160Mi
        limits:
          cpu: 500m
          memory: 384Mi
      dataVolumeClaimSpec:
        storageClassName: infernix-manual
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  proxy:
    pgBouncer:
      replicas: 1
      image: docker.io/percona/percona-pgbouncer:1.25.1-1
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 96Mi
  backups:
    enabled: true
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.58.0-1
      containers:
        pgbackrest:
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 192Mi
        pgbackrestConfig:
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      jobs:
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 100m
            memory: 192Mi
      repoHost:
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 100m
            memory: 192Mi
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              storageClassName: infernix-manual
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

# Phase 7 Sprint 7.1: Keycloak release. Self-signup on, email
# verification off; the realm definition lives in
# `chart/templates/keycloak/configmap-realm-import.yaml` and is mounted
# read-only at `/opt/keycloak/data/import/`. Demo-gated; absent when
# `demo.enabled = false`.
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0.7"
    pullPolicy: IfNotPresent
  javaOptsHeap: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=50"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  # The local demo runs one Keycloak application pod until Sprint 7.14
  # validates cookie-aware `/auth` proxy affinity or clustered embedded
  # cache behavior through Envoy Gateway. The backing Patroni Postgres
  # cluster is a single instance (Phase 3 Sprint 3.16): the Percona operator
  # remains the deployment mechanism and is no longer retained as a
  # high-availability mechanism; instance loss is restore-from-backup.
  replicaCount: 1
  # Phase 7 Sprint 7.14: operator-facing base URL the demo backend
  # expects the issuer claim to match. Cluster materialization overrides
  # this with the active edge URL and Keycloak uses that full URL
  # strictly, so browser form actions and OIDC redirects preserve the
  # local edge host and port instead of re-deriving them from forwarded
  # headers. Operators with a different routing topology should override
  # this to match the routed issuer, e.g. @https://infernix.example.com/auth@.
  externalBaseUrl: http://127.0.0.1/auth
  theme:
    name: infernix
  realm:
    name: infernix
    displayName: Infernix Demo
    clientId: infernix-spa
    spaClientId: infernix-spa
    issuerUrl: /auth/realms/infernix
    # Phase 9: cluster-wide admin RBAC. Only members of this realm role reach
    # the operator consoles (image registry, Pulsar Admin) and cluster-wide monitoring;
    # self-registered users are non-admin by construction.
    adminRealmRole: infernix-admin
    # Hardcoded demo admin account in the infernix realm (demo app; not a
    # production credential). Distinct from the Keycloak master admin below.
    demoAdmin:
      username: admin
      password: infernix-admin-demo
  admin:
    user: admin
    secretName: infernix-keycloak-admin
  database:
    secretName: infernix-keycloak-db-user
    host: keycloak-postgresql-pgbouncer.platform.svc.cluster.local
    port: 5432
    dbName: keycloak
  service:
    port: 8080

pulsar:
  # Pulsar is only enabled in the final Helm phase, so force the upstream init jobs to run there.
  initialize: true
  nameOverride: infernix-pulsar
  components:
    zookeeper: true
    bookkeeper: true
    autorecovery: true
    broker: true
    proxy: true
    toolset: true
    pulsar_manager: false
    functions: false
    oxia: false
  affinity:
    anti_affinity: false
    type: preferredDuringSchedulingIgnoredDuringExecution
  zookeeper:
    replicaCount: 1
    podMonitor:
      enabled: false
    affinity:
      anti_affinity: false
    resources:
      requests:
        memory: 128Mi
        cpu: 0.05
      limits:
        memory: 256Mi
    volumes:
      data:
        storageClassName: infernix-manual
        size: 5Gi
  bookkeeper:
    metadata:
      resources:
        requests:
          memory: 128Mi
          cpu: 0.05
        limits:
          memory: 256Mi
    replicaCount: 1
    podMonitor:
      enabled: false
    affinity:
      anti_affinity: false
    resources:
      requests:
        memory: 256Mi
        cpu: 0.1
      limits:
        memory: 512Mi
    configData:
      # Local host-path PVs share the developer's backing filesystem. Favor
      # absolute remaining space over the upstream default 95% utilization cap
      # so repeat cluster down/up cycles still recover on very full developer
      # hosts while a small amount of writable space still remains.
      diskUsageLwmThreshold: "0.999"
      diskUsageWarnThreshold: "0.9995"
      diskUsageThreshold: "0.9999"
    volumes:
      journal:
        storageClassName: infernix-manual
        size: 5Gi
      ledgers:
        storageClassName: infernix-manual
        size: 5Gi
  pulsar_metadata:
    resources:
      requests:
        memory: 128Mi
        cpu: 0.05
      limits:
        memory: 256Mi
  broker:
    replicaCount: 1
    podMonitor:
      enabled: false
    affinity:
      anti_affinity: false
    resources:
      requests:
        memory: 256Mi
        cpu: 0.1
      limits:
        memory: 512Mi
    configData:
      # Required before namespace/topic-level producer dedup policies take effect.
      brokerDeduplicationEnabled: "true"
      # Phase 3 Sprint 3.16: one bookie means an ensemble of one. These three
      # were previously set only by the Apple local-topology override; the
      # single-node shape is now the default rather than the exception.
      managedLedgerDefaultEnsembleSize: "1"
      managedLedgerDefaultWriteQuorum: "1"
      managedLedgerDefaultAckQuorum: "1"
  proxy:
    replicaCount: 1
    configData:
      webSocketServiceEnabled: "true"
      # Engine consumers retain their delivery until real inference and result
      # publication complete. Pulsar 4.0.9's proxy WebSocket servlet is bounded
      # by the proxy HTTP-server idle timeout, so keep that connection alive
      # beyond the integration/runtime inference ceiling.
      httpServerIdleTimeout: "7200000"
    podMonitor:
      enabled: false
    affinity:
      anti_affinity: false
    resources:
      requests:
        memory: 192Mi
        cpu: 0.1
      limits:
        memory: 512Mi
    service:
      type: NodePort
      nodePorts:
        http: "30080"
        pulsar: "30650"
  autorecovery:
    replicaCount: 1
    podMonitor:
      enabled: false
    configData:
      BOOKIE_MEM: "-Xms64m -Xmx256m -XX:MaxDirectMemorySize=128m"
    resources:
      requests:
        memory: 192Mi
        cpu: 0.05
      limits:
        memory: 512Mi
  toolset:
    resources:
      requests:
        memory: 128Mi
        cpu: 0.05
      limits:
        memory: 256Mi
